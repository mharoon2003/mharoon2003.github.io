<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 – Page Not Found | Haroon Nadim</title>
  <link href="https://fonts.googleapis.com/css?family=Concert+One" rel="stylesheet">
  <link rel="stylesheet" href="css/404.css">
  
  <!-- Inline CSS for button positioning -->
  <style>
    .back-home {
      position: fixed;
      top: 2rem;
      left: 2rem;
      right: auto;
      bottom: auto;
      transform: none;
      padding: 0.8rem 1.6rem;
      background: #13242c;
      color: #fff;
      border-radius: 30px;
      font-size: 1rem;
      text-decoration: none;
      transition: all 0.3s ease;
      z-index: 1000;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    
    .back-home:hover {
      background: #000;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }
    
    .back-home i {
      font-size: 1.2rem;
    }
    
    /* Light theme support */
    body.light .back-home {
      background: #0891b2;
    }
    
    body.light .back-home:hover {
      background: #0e7490;
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .back-home {
        top: 1rem;
        left: 1rem;
        padding: 0.6rem 1.2rem;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <!-- ✅ Back to Home Button - TOP LEFT -->
  <a href="index.html" class="back-home">
    <i class="bx bx-arrow-back"></i>
    <span>Back to Home</span>
  </a>

  <div class="text">404</div>

  <div class="container">
    <!-- Caveman Left -->
    <div class="caveman">
      <div class="leg"><div class="foot"><div class="fingers"></div></div></div>
      <div class="leg"><div class="foot"><div class="fingers"></div></div></div>
      <div class="shape">
        <div class="circle"></div>
        <div class="circle"></div>
      </div>
      <div class="head">
        <div class="eye"><div class="nose"></div></div>
        <div class="mouth"></div>
      </div>
      <div class="arm-right"><div class="club"></div></div>
    </div>
    <!-- Caveman Right -->
    <div class="caveman">
      <div class="leg"><div class="foot"><div class="fingers"></div></div></div>
      <div class="leg"><div class="foot"><div class="fingers"></div></div></div>
      <div class="shape">
        <div class="circle"></div>
        <div class="circle"></div>
      </div>
      <div class="head">
        <div class="eye"><div class="nose"></div></div>
        <div class="mouth"></div>
      </div>
      <div class="arm-right"><div class="club"></div></div>
    </div>
  </div>

  <!-- Dynamic Message -->
  <div id="error-message" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: #fff; font-family: sans-serif; z-index: 10; padding: 2rem; max-width: 90%;">
    <h2 id="dynamic-title" style="font-size: 2rem; margin-bottom: 1rem;">Oops! Page Not Found</h2>
    <p id="dynamic-desc" style="font-size: 1.2rem; margin-bottom: 2rem;">The page you are looking for doesn't exist.</p>
  </div>

  <script>
    // Check if user was trying to download CV
    const titleEl = document.getElementById('dynamic-title');
    const descEl = document.getElementById('dynamic-desc');
    const currentPath = window.location.pathname;
    const referrer = document.referrer;

    // Detect CV download attempt
    if (currentPath.includes('.pdf') || currentPath.includes('cv') || currentPath.includes('CV')) {
      titleEl.textContent = "📄 CV File Not Found";
      descEl.innerHTML = "The CV file is currently being updated.<br><br>Please contact me directly to request the latest version!";
    }
    // Detect portfolio navigation
    else if (referrer.includes('index.html') || referrer.includes('portfolio')) {
      titleEl.textContent = "Page Not Found";
      descEl.textContent = "The page you're looking for has moved or doesn't exist.";
    }

    // Theme persistence
    if (localStorage.getItem("theme") === "light") {
      document.body.classList.add("light");
    }
  </script>
</body>
</html>
